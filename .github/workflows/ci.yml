name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Браузер в CI не нужен: тесты не запускают Puppeteer.
      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
        env:
          LOG_CONSOLE: '0'
          LOG_LEVEL: error
