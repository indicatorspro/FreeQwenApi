# Custom provider configuration snippet for Hermes Agent
# Add this block to ~/.hermes/config.yaml and restart Hermes.

custom_providers:
  - name: qwen-free
    base_url: http://localhost:3264/api
    model: qwen3.7-max
    api_key: dummy-key

# Usage:
# hermes chat --provider custom:qwen-free --model qwen3.7-max
#
# Testing tools/skills:
# hermes chat --provider custom:qwen-free --model qwen3.7-max \
#   -q 'How do I set up a Hermes Agent gateway for Telegram? Use the appropriate skill first.'
#
# Expected: Hermes should show a skill_view call, then respond based on the skill result.
